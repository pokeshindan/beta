<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケモナライズ診断</title>
    <style>
        :root {
            --primary-color: #e3350d;
            --secondary-color: #313131;
            --bg-color: #f4f4f4;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background-color: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 30px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 20px;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 10px;
        }

        .hidden {
            display: none !important;
        }

        /* 共通ボタン・入力スタイル */
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #b52a0a;
        }

        /* 質問エリア */
        .progress-bar {
            width: 100%;
            background-color: #ddd;
            height: 8px;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background-color: #4caf50;
            width: 0%;
            transition: width 0.3s;
        }

        .question-text {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option-btn {
            background-color: #f0f0f0;
            color: var(--text-color);
            text-align: left;
            padding: 15px;
            border: 1px solid #ccc;
        }

        .option-btn:hover {
            background-color: #e0e0e0;
        }

        /* 結果エリア */
        .result-section {
            border: 2px solid var(--secondary-color);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            background-color: #fafafa;
        }

        .copy-area {
            background-color: #272822;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            font-family: monospace;
            font-size: 12px;
            margin-top: 10px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📋 ポケモナライズ診断</h1>

    <!-- 1. 名前入力画面 -->
    <div id="start-screen">
        <p>MBTIの16性格タイプ診断をベースに、あなたをポケモン化します！</p>
        <p><strong>あなたの名前をカタカナでおしえてください：</strong></p>
        <input type="text" id="user-name" placeholder="例：タカシ" maxlength="10">
        <button id="start-btn">診断をはじめる</button>
    </div>

    <!-- 2. 質問画面 -->
    <div id="quiz-screen" class="hidden">
        <div class="progress-bar"><div id="progress" class="progress"></div></div>
        <p id="question-number" style="color: #666; font-size: 14px;"></p>
        <div id="question-text" class="question-text"></div>
        <div class="options-grid">
            <button class="option-btn" onclick="submitAnswer(1)">1：全くない（当てはまらない）</button>
            <button class="option-btn" onclick="submitAnswer(2)">2：あまりない</button>
            <button class="option-btn" onclick="submitAnswer(3)">3：ややある</button>
            <button class="option-btn" onclick="submitAnswer(4)">4：非常にある（当てはまる）</button>
        </div>
    </div>

    <!-- 3. 結果画面 -->
    <div id="result-screen" class="hidden">
        <h2>診断結果</h2>
        <div id="result-text" class="result-section"></div>
        
        <h3>🎨 画像生成プロンプト</h3>
        <p style="font-size: 13px; color:#666;">以下のテキストをコピーして画像生成AIに入力すると、ステータス画面が生成されます。</p>
        <div id="prompt-code" class="copy-area"></div>
        <button id="copy-btn" style="margin-top:15px; background-color: var(--secondary-color);">プロンプトをコピーする</button>
        <button onclick="location.reload()" style="margin-top:10px; background-color: #666;">もう一度診断する</button>
    </div>
</div>

<script>
// 質問リストデータ (type: 1=E/I, 2=S/N, 3=T/F, 4=J/P | sign: 1=プラス, -1=マイナス)
const questions = [
    { text: "初対面の人ばかりの集まりでも、自分から積極的に話しかけにいく。", type: "EI", sign: 1 },
    { text: "週末に予定がなく一人で家にいると、退屈でエネルギーが切れたように感じる。", type: "EI", sign: 1 },
    { text: "自分の考えやアイデアを、言葉や行動で周囲にアピールするのが得意だ。", type: "EI", sign: 1 },
    { text: "大人数でワイワイ過ごすよりも、気心の知れた少人数で静かに過ごす方が好きだ。", type: "EI", sign: -1 },
    { text: "外出してたくさんの人と関わった後は、一人の時間を作って充電する必要がある。", type: "EI", sign: -1 },
    { text: "自分の意見を求められたとき、口に出す前に頭の中でじっくり考えてから発言する。", type: "EI", sign: -1 },
    
    { text: "物事を考えるときは、抽象的な理想よりも「過去のデータ」や「事実」を重視する。", type: "SN", sign: 1 },
    { text: "マニュアルや手順書がある作業を、ミスなく正確に進めることが得意だ。", type: "SN", sign: 1 },
    { text: "無駄話やファンタジーな話よりも、実生活や仕事にすぐ役立つ実用的な話が好きだ。", type: "SN", sign: 1 },
    { text: "小説や映画、アニメの世界に深くのめり込み、その設定や背景を考察するのが好きだ。", type: "SN", sign: -1 },
    { text: "クリエイティブなアイデアを出したり、まだ誰も試していない新しい方法に挑戦するのが好きだ。", type: "SN", sign: -1 },
    { text: "日常の些細な出来事から、何か深い意味や将来の可能性を妄想（想像）することが多い。", type: "SN", sign: -1 },
    
    { text: "友人の悩み相談に乗るときは、慰めるよりも「具体的にどう解決するか」のアドバイスを優先しがちだ。", type: "TF", sign: 1 },
    { text: "議論や話し合いの場では、相手の感情に配慮するよりも「筋が通っているか（正論か）」を重視する。", type: "TF", sign: 1 },
    { text: "何か大きな決断をするときは、自分の感情や好き嫌いを排除して客観的に損得を計算する。", type: "TF", sign: 1 },
    { text: "映画や小説、他人の実体験の話に感情移入しやすく、涙もろい方だと思う。", type: "TF", sign: -1 },
    { text: "周囲の人間関係のギスギスした空気や、他人のピリピリした感情を敏感に察知する。", type: "TF", sign: -1 },
    { text: "たとえ正論であっても、相手の気持ちを傷つけるような言い方は避けるべきだと思う。", type: "TF", sign: -1 },
    
    { text: "旅行や仕事の予定を立てるときは、事前にしっかりとしたタイムスケジュールを決めてから動きたい。", type: "JP", sign: 1 },
    { text: "提出物の締め切りや約束の時間は、何があっても余裕を持って守るようにしている。", type: "JP", sign: 1 },
    { text: "部屋の片付けやタスクの消化など、決まったルーティンを毎日計画通りにこなすのが好きだ。", type: "JP", sign: 1 },
    { text: "細かいルールや約束事を守るよりも、その場のノリや直感を信じて行動することの方が多い。", type: "JP", sign: -1 },
    { text: "あらかじめ決まっていた予定が急に変更になっても、ストレスを感じず「まあいいか」と楽しめる。", type: "JP", sign: -1 },
    { text: "仕事や勉強の課題は、早くからコツコツやるよりも、締め切り直前に集中して一気に終わらせるタイプだ。", type: "JP", sign: -1 }
];

let currentIdx = 0;
let rawName = "";
let pokemonName = "";
let scores = { EI: 0, SN: 0, TF: 0, JP: 0 };

// 開始処理
document.getElementById('start-btn').addEventListener('click', () => {
    rawName = document.getElementById('user-name').value.trim();
    if(!rawName) { alert("カタカナでお名前を入力してください！"); return; }
    
    // ポケモン名へのアレンジ（簡単な語尾モディファイ）
    const suffixes = ["ルス", "リス", "ノドン", "ゲロス", "ネクス", "ムス"];
    pokemonName = rawName + suffixes[Math.abs(rawName.charCodeAt(0) || 0) % suffixes.length];
    
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    showQuestion();
});

// 質問表示
function showQuestion() {
    if(currentIdx >= questions.length) {
        calculateResult();
        return;
    }
    document.getElementById('progress').style.width = `${(currentIdx / questions.length) * 100}%`;
    document.getElementById('question-number').innerText = `第 ${currentIdx + 1} 問 / 全 ${questions.length} 問`;
    document.getElementById('question-text').innerText = questions[currentIdx].text;
}

// 回答送信
function submitAnswer(val) {
    const q = questions[currentIdx];
    let score = val;
    if(q.sign === -1) {
        score = 5 - val; // 1->4, 2->3, 3->2, 4->1 反転
    }
    scores[q.type] += score;
    currentIdx++;
    showQuestion();
}

// 結果計算と出力
function calculateResult() {
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');

    // 各指標の判定（中央値 15 を基準に決定）
    const isE = scores.EI >= 15;
    const isS = scores.SN >= 15;
    const isT = scores.TF >= 15;
    const isJ = scores.JP >= 15;

    // MBTIタイプ文字列
    const mbti = `${isE?'E':'I'}${isS?'S':'O' /* Nの代わりにO(直感用)で仮判定用 */}${isT?'T':'F'}${isJ?'J':'P'}`;

    // スコアに応じたタイプと特性の簡易ロジックマッピング
    let type1 = "ノーマル", type2 = "";
    let ability = "プレッシャー";
    let copy = "バランスの取れた標準的な性質を持つ。";
    
    if(isE && isT) { type1 = "ほのお"; type2 = "はがね"; ability = "まけんき"; copy = "情熱的かつ論理的に突き進むリーダー気質。"; }
    else if(!isE && !isT) { type1 = "エスパー"; type2 = "フェアリー"; ability = "シンクロ"; copy = "繊細な感受性と豊かな想像力を持つ癒やし手。"; }
    else if(isE && !isT) { type1 = "でんき"; type2 = "ひこう"; ability = "プラス"; copy = "周囲を明るく巻き込むムードメーカー。"; }
    else { type1 = "みず"; type2 = "こおり"; ability = "クリアボディ"; copy = "冷静沈着で独自の視点を持つ職人肌。"; }

    // 種族値の計算（合計540固定調整）
    // スコアの強弱で配分
    let baseHp = 70 + (scores.EI); // Eが高いとHP高め
    let baseAtk = 70 + (scores.EI - 10);
    let baseDef = 70 + (scores.JP); // Jが高いと強固
    let baseSpAtk = 70 + (30 - scores.SN); // N(スコア低い)と高め
    let baseSpDef = 70 + (scores.TF); // Tが高いと高め
    let baseSpd = 70 + (30 - scores.JP); // P(スコア低い)と敏捷
