<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケモナライズ診断</title>
    <style>
        :root {
            --bg-color: #121214;
            --panel-color: #1e1e24;
            --accent-color: #a855f7;
            --text-color: #f3f4f6;
            --border-color: #374151;
        }
        * { box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--panel-color);
            border: 4px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 { text-align: center; color: var(--accent-color); font-size: 24px; margin-bottom: 20px; }
        .screen { display: none; }
        .screen.active { display: block; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 2px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            font-size: 16px;
            margin-bottom: 20px;
            text-align: center;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn:hover { background: #9333ea; }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #111;
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress-fill { height: 100%; background: var(--accent-color); width: 0%; transition: width 0.3s; }
        .question-text { font-size: 18px; line-height: 1.6; margin-bottom: 30px; min-height: 60px; text-align: center; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .opt-btn {
            background: #2a2a35;
            color: var(--text-color);
            border: 2px solid var(--border-color);
            padding: 14px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 15px;
            transition: all 0.2s;
        }
        .opt-btn:hover { background: #3f3f52; border-color: var(--accent-color); }
        .result-box { background: #111; border: 2px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .res-title { font-size: 18px; font-weight: bold; color: #f59e0b; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .stats-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 15px; align-items: center; }
        .stats-bar-bg { width: 55%; background: #222; height: 16px; border-radius: 3px; overflow: hidden; border: 1px solid #444; }
        .stats-bar-fill { height: 100%; background: #10b981; }
        .analysis-text { font-size: 14px; line-height: 1.6; color: #d1d5db; margin-top: 10px; white-space: pre-line; }
        .mbti-bar-fill { height: 100%; background: #3b82f6; }
        .prompt-area {
            width: 100%;
            height: 120px;
            background: #000;
            color: #10b981;
            font-family: monospace;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            resize: none;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🧬 ポケモナライズ診断</h1>
    <div id="screen-name" class="screen active">
        <p style="text-align: center; margin-bottom: 25px;">ポケモナライズの世界へようこそ！<br>まずはあなたの名前をカタカナで入力してください。</p>
        <input type="text" id="user-name" placeholder="サトシ" maxlength="10">
        <button class="btn" onclick="startDiagnosis()">診断を開始する</button>
    </div>
    <div id="screen-quiz" class="screen">
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        <div id="question-text" class="question-text">質問がここに表示されます</div>
        <div class="options">
            <button class="opt-btn" onclick="submitAnswer(4)">🟢 非常にあてはまる</button>
            <button class="opt-btn" onclick="submitAnswer(3)">🔵 ややあてはまる</button>
            <button class="opt-btn" onclick="submitAnswer(2)">🟡 あまりあてはまらない</button>
            <button class="opt-btn" onclick="submitAnswer(1)">🔴 全くあてはまらない</button>
        </div>
    </div>
    <div id="screen-result" class="screen">
        <h2 style="text-align: center; color:#10b981; margin-bottom:20px;">分析完了！</h2>
        
        <div class="result-box">
            <div class="res-title">🧬 基本情報</div>
            <div class="stats-row"><span>なまえ:</span><span id="res-name" style="font-weight:bold; color:#a855f7;">-</span></div>
            <div class="stats-row"><span>タイプ:</span><span id="res-type">-</span></div>
            <div class="stats-row"><span>とくせい:</span><span id="res-ability">-</span></div>
            <div id="res-summary" class="analysis-text" style="color:#f59e0b; font-weight:bold; border-top:1px solid #222; padding-top:10px;"></div>
        </div>

        <div class="result-box">
            <div class="res-title">🧠 性格特性の解析（人間性パラメータ）</div>
            <div id="mbti-container"></div>
            <div id="analysis-desc" class="analysis-text" style="border-top:1px solid #222; padding-top:10px;"></div>
        </div>

        <div class="result-box">
            <div class="res-title">📊 種族値</div>
            <div id="stats-container"></div>
        </div>

        <div class="result-box">
            <div class="res-title">⚔️ わざ構成</div>
            <div id="moves-container" style="line-height: 1.8; font-size:15px;"></div>
        </div>

        <div class="result-box" style="border-color: #a855f7;">
            <div class="res-title" style="color: #a855f7;">🎨 あなたの相棒ポケモンに会いに行おう</div>
            <p style="font-size: 13px; margin: 5px 0;">以下のプロンプトをコピーしてAI画像生成に入力してください。</p>
            <textarea id="prompt-output" class="prompt-area" readonly></textarea>
            <button class="btn" onclick="copyPrompt()">プロンプトをコピー</button>
        </div>
        <button class="btn" style="background:#4b5563;" onclick="location.reload()">もう一度診断する</button>
    </div>
</div>
<script>
const questions = [
    { id: 1, type: "EI", dir: 1, text: "初対面の人ばかりの集まりでも、自分から積極的に話しかけにいく。" },
    { id: 2, type: "EI", dir: 1, text: "週末に予定がなく一人で家にいると、退屈でエネルギーが切れたように感じる。" },
    { id: 3, type: "EI", dir: 1, text: "自分の考えやアイデアを、言葉や行動で周囲にアピールするのが得意だ。" },
    { id: 4, type: "EI", dir: -1, text: "大人数でワイワイ過ごすよりも、気心の知れた少人数で静かに過ごす方が好きだ。" },
    { id: 5, type: "EI", dir: -1, text: "外出してたくさんの人と関わった後は、一人の時間を作って充電する必要がある。" },
    { id: 6, type: "EI", dir: -1, text: "自分の意見を求められたとき、口に出す前に頭の中でじっくり考えてから発言する。" },
    { id: 7, type: "SN", dir: 1, text: "物事を考えるときは、抽象的な理想よりも「過去のデータ」や「事実」を重視する。" },
    { id: 8, type: "SN", dir: 1, text: "マニュアルや手順書がある作業を、ミスなく正確に進めることが得意だ。" },
    { id: 9, type: "SN", dir: 1, text: "無駄話やファンタジーな話よりも、実生活や仕事にすぐ役立つ実用的な話が好きだ。" },
    { id: 10, type: "SN", dir: -1, text: "小説や映画、アニメの世界に深くのめり込み、その設定や背景を考察するのが好きだ。" },
    { id: 11, type: "SN", dir: -1, text: "クリエイティブなアイデアを出したり、まだ誰も試していない新しい方法に挑戦するのが好きだ。" },
    { id: 12, type: "SN", dir: -1, text: "日常の些細な出来事から、何か深い意味や将来の可能性を妄想（想像）することが多い。" },
    { id: 13, type: "TF", dir: 1, text: "友人の悩み相談に乗るときは、慰めるよりも「具体的にどう解決するか」のアドバイスを優先しがちだ。" },
    { id: 14, type: "TF", dir: 1, text: "議論や話し合いの場では、相手の感情に配慮するよりも「筋が通っているか（正論か）」を重視する。" },
    { id: 15, type: "TF", dir: 1, text: "何か大きな決断をするときは、自分の感情や好き嫌いを排除して客観的に損得を計算する。" },
    { id: 16, type: "TF", dir: -1, text: "映画や小説、他人の実体験の話に感情移入しやすく、涙もろい方だと思う。" },
    { id: 17, type: "TF", dir: -1, text: "周囲の人間関係のギスギスした空気や、他人のピリピリした感情を敏感に察知する。" },
    { id: 18, type: "TF", dir: -1, text: "たとえ正論であっても、相手の気持ちを傷つけるような言い方は避けるべきだと思う。" },
    { id: 19, type: "JP", dir: 1, text: "旅行や仕事の予定を立てるときは、事前にしっかりとしたタイムスケジュールを決めてから動きたい。" },
    { id: 20, type: "JP", dir: 1, text: "提出物の締め切りや約束の時間は、何があっても余裕を持って守るようにしている。" },
    { id: 21, type: "JP", dir: 1, text: "部屋の片付けやタスクの消化など、決まったルーティンを毎日計画通りにこなすのが好きだ。" },
    { id: 22, type: "JP", dir: -1, text: "細かいルールや約束事を守るよりも、その場のノリや直感を信じて行動することの方が多い。" },
    { id: 23, type: "JP", dir: -1, text: "あらかじめ決まっていた予定が急に変更になっても、ストレスを感じず「まあいいか」と楽しめる。" },
    { id: 24, type: "JP", dir: -1, text: "仕事や勉強の課題は、早くからコツコツやるよりも、締め切り直前に集中して一気に終わらせるタイプだ。" }
];

let currentIdx = 0;
let rawName = "";
let pokemonName = "";
let scores = { EI: 0, SN: 0, TF: 0, JP: 0 };

function startDiagnosis() {
    rawName = document.getElementById("user-name").value.trim();
    if(!rawName) { alert("カタカナで名前を入力してください！"); return; }
    const suffixes = ["ロス", "リス", "ノドン", "ゲリオン", "ウス", "ガロン"];
    const randomSuffix = suffixes[rawName.length % suffixes.length];
    pokemonName = rawName + randomSuffix;
    switchScreen("screen-name", "screen-quiz");
    showQuestion();
}

function switchScreen(hideId, showId) {
    document.getElementById(hideId).classList.remove("active");
    document.getElementById(showId).classList.add("active");
}

function showQuestion() {
    if(currentIdx >= questions.length) { calculateResult(); return; }
    const q = questions[currentIdx];
    document.getElementById("question-text").innerText = `Q${currentIdx + 1}: ${q.text}`;
    document.getElementById("progress-fill").style.width = `${(currentIdx / questions.length) * 100}%`;
}

function submitAnswer(val) {
    const q = questions[currentIdx];
    let score = val;
    if(q.dir === -1) { score = 5 - val; }
    scores[q.type] += score;
    currentIdx++;
    showQuestion();
}

function calculateResult() {
    switchScreen("screen-quiz", "screen-result");
    
    // 各指標の割合（最低6点〜最高24点なので、割合％に変換）
    const getPercentage = (score) => Math.round(((score - 6) / 18) * 100);
    const pEI = getPercentage(scores.EI);
    const pSN = getPercentage(scores.SN);
    const pTF = getPercentage(scores.TF);
    const pJP = getPercentage(scores.JP);

    const isE = scores.EI >= 15;
    const isS = scores.SN >= 15;
    const isT = scores.TF >= 15;
    const isJ = scores.JP >= 15;

    let type1 = "ノーマル", type2 = "";
    let ability = "ばんのう";
    let englishKeywords = "versatile character, balanced mind";
    let bodyMaterial = "standard texture";
    let moves = [];
    
    let summaryText = "";
    let analysisDesc = "";

    // 4パターンの詳細な性格・性能の紐付け解析テキスト
    if (isE && isT) { 
        type1 = "ほのお"; type2 = "はがね"; ability = "ふくつのこころ"; englishKeywords = "passionate spirit, high discipline"; bodyMaterial = "sleek silver metal and glowing ruby armor"; moves = ["フレアドライブ", "アイアンヘッド", "ビルドアップ", "ままもる"]; 
        summaryText = "内面に熱いパッションを秘めつつ、規律を守る鉄壁のリーダー！";
        analysisDesc = "【タイプ分析】高い外向性と論理性が「ほのお」、時間や規律への厳格さが「はがね」を形成しました。\n【種族値解析】自己主張と行動力の高さが「こうげき」を高め、ルールを死守する誠実さが圧倒的な「ぼうぎょ」の数値に直結しています。";
    }
    else if (!isE && isT && isS) { 
        type1 = "エスパー"; type2 = "はがね"; ability = "シンクロ"; englishKeywords = "high intelligence, absolute defense"; bodyMaterial = "sleek silver metal and glowing purple crystalline armor plating"; moves = ["サイコキネシス", "アイアンヘッド", "てっぺき", "みらいよち"]; 
        summaryText = "深い洞察力と論理的な思考力を持ち、他者との約束を完璧に守る「冷徹な知略家」！";
        analysisDesc = "【タイプ分析】物事の背景や深い設定を読み解く高い知性が「エスパー」、他者との約束や締め切りを絶対に破らない強固な責任感が「はがね」を呼び覚ましました。\n【種族値解析】周囲の空気を鋭く察知する思慮深さから、物理攻撃よりも「とくこう（知性）」が発達。コツコツ課題を終わらせる計画性が「すばやさ」と「ぼうぎょ（堅実さ）」の高さの最大の理由です。";
    }
    else if (isE && !isT) { 
        type1 = "フェアリー"; type2 = "でんき"; ability = "マイペース"; englishKeywords = "bright energy, high empathy"; bodyMaterial = "sparkling yellow and pink neon skin"; moves = ["10まんボルト", "ムーンフォース", "てだすけ", "いやしのすず"]; 
        summaryText = "圧倒的な共感力で場を明るく盛り上げる、みんなのムードメーカー！";
        analysisDesc = "【タイプ分析】他人の感情に寄り添う温かさが「フェアリー」、持ち前のフットワークの軽さと明るさが「でんき」に変換されました。\n【種族値解析】自分のルーティンに縛られない柔軟な姿勢から、防御よりも「すばやさ（フットワーク）」が上昇。他人の悩みを解決へと導くサポート力が、わざの「てだすけ」や「いやしのすず」に表れています。";
    }
    else { 
        type1 = "ゴースト"; type2 = "あく"; ability = "プレッシャー"; englishKeywords = "deep shadow, mysterious aura"; bodyMaterial = "dark shadowy mist and obsidian core"; moves = ["シャドーボール", "あくのはどう", "ちょうはつ", "おにび"]; 
        summaryText = "独自の世界観を内に秘めた、ミステリアスな単独行動派！";
        analysisDesc = "【タイプ分析】一人の時間を何より大切にする内向的な気質が「ゴースト」、他人に流されず損得を客観的に計算できるクールさが「あく」となりました。\n【種族値解析】他人の感情のピリピリ感を敏感に察知しつつも、自分の領域を侵させない防御壁を持つため、「HP（ストレス耐性）」と「とくぼう（スルー技術）」が高くなっています。";
    }

    let hp = 70 + Math.floor(scores.EI / 2);
    let atk = 60 + (isE ? 30 : 10);
    let def = 60 + (isJ ? 45 : 10);
    let satk = 60 + (!isS ? 35 : 15);
    let sdef = 60 + (isT ? 20 : 30);
    let spd = 60 + (!isJ ? 25 : 15);
    
    const diff = 540 - (hp + atk + def + satk + sdef + spd);
    def += diff; 

    // 結果画面の描画
    document.getElementById("res-name").innerText = pokemonName;
    document.getElementById("res-type").innerText = type2 ? `${type1} / ${type2}` : type1;
    document.getElementById("res-ability").innerText = ability;
    document.getElementById("res-summary").innerText = summaryText;
    document.getElementById("analysis-desc").innerText = analysisDesc;

    // 性格特性（MBTI）バーの描画
    const mbtiData = [
        { label: "エネルギー", left: "内向型", right: "外向型", val: pEI },
        { label: "物事の捉え方", left: "直感型", right: "現実型", val: pSN },
        { label: "判断の基準", left: "感情型", right: "論理型", val: pTF },
        { label: "物事への接し方", left: "柔軟型", right: "規律型", val: pJP }
    ];
    let mbtiHtml = "";
    mbtiData.forEach(m => {
        mbtiHtml += `
            <div style="margin-bottom: 12px; font-size:13px;">
                <div style="display:flex; justify-content:space-between; margin-bottom:2px;">
                    <span>${m.left}</span><strong>${m.label}</strong><span>${m.right}</span>
                </div>
                <div style="display:flex; align-items:center; justify-content:space-between;">
                    <span style="font-size:11px; color:#9ca3af;">${100 - m.val}%</span>
                    <div class="stats-bar-bg" style="width:80%; height:10px;"><div class="mbti-bar-fill" style="width: ${m.val}%;"></div></div>
                    <span style="font-size:11px; color:#9ca3af;">${m.val}%</span>
                </div>
            </div>`;
    });
    document.getElementById("mbti-container").innerHTML = mbtiHtml;

    // 種族値バーの描画
    const statsData = [
        { name: "HP", val: hp }, { name: "こうげき", val: atk }, { name: "ぼうぎょ", val: def },
        { name: "とくこう", val: satk }, { name: "とくぼう", val: sdef }, { name: "すばやさ", val: spd }
    ];
    let statsHtml = "";
    statsData.forEach(s => {
        const percent = (s.val / 150) * 100;
        statsHtml += `<div class="stats-row"><span style="width: 70px; font-size:14px;">${s.name}:</span><span style="width: 35px; font-weight:bold; font-size:14px;">${s.val}</span><div class="stats-bar-bg"><div class="stats-bar-fill" style="width: ${percent}%;"></div></div></div>`;
    });
    document.getElementById("stats-container").innerHTML = statsHtml;

    let movesHtml = "";
    moves.forEach((m, i) => { movesHtml += `<div>${i+1}. ${m}</div>`; });
    document.getElementById("moves-container").innerHTML = movesHtml;

    const typeStr = type2 ? `${type1} / ${type2}` : type1;
