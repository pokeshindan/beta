<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケモナライズ診断 - Pokémonalize Test</title>
    <style>
        :root {
            --primary-color: #e51c23;
            --secondary-color: #3b4cca;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            padding: 30px;
            text-align: center;
            transition: all 0.3s ease;
        }

        h1 {
            color: var(--primary-color);
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin: 20px 0;
        }

        input[type="text"] {
            width: 80%;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 25px;
            outline: none;
            text-align: center;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--secondary-color);
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(229, 28, 35, 0.3);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn:hover {
            background-color: #cd1a1f;
            transform: translateY(-2px);
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #eee;
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background-color: var(--secondary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-text {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 30px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 15px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background-color: #edf2ff;
            border-color: var(--secondary-color);
            color: var(--secondary-color);
        }

        /* 診断結果画面のスタイル */
        .result-title {
            font-size: 24px;
            color: var(--secondary-color);
            margin-bottom: 5px;
        }
        .catchphrase {
            font-style: italic;
            color: #555;
            margin-bottom: 20px;
        }
        .status-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            text-align: left;
            margin-bottom: 20px;
        }
        .stat-row {
            display: flex;
            align-items: center;
            margin: 8px 0;
        }
        .stat-label {
            width: 100px;
            font-weight: bold;
            font-size: 14px;
        }
        .stat-bar-container {
            flex-grow: 1;
            height: 12px;
            background: #eee;
            border-radius: 6px;
            margin: 0 10px;
            overflow: hidden;
        }
        .stat-bar {
            height: 100%;
            background: #ff9800;
            border-radius: 6px;
        }
        .stat-val {
            width: 30px;
            text-align: right;
            font-weight: bold;
            font-size: 14px;
        }
        .moves-container {
            text-align: left;
            margin-bottom: 20px;
        }
        .move-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
        }
        .move-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .move-type {
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
        }
        .prompt-textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-family: monospace;
            font-size: 12px;
            background: #fafafa;
            resize: none;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="card" id="game-card">

        </div>

        <!-- 結果画面 -->
        <div id="result-view" class="hidden">

                <div id="stats-bars"></div>
            </div>

            <div class="moves-container">
                <div style="font-weight:bold; margin-bottom:10px;">⚔️ わざ構成（完全公式わざ版）</div>
                <div id="res-moves"></div>
            </div>

            <div class="status-box" style="background:#eef2ff; border: 1px solid #ccd7ff;">
                <div style="font-weight:bold; color:var(--secondary-color); margin-bottom:8px;">🎨 あなたの相棒ポケモンに会いに行こう</div>
                <p style="font-size:12px; margin:0 0 10px 0; color:#555;">以下の英語プロンプトを画像生成AI（DALL-E 3やMidjourneyなど）に入力すると、あなたのステータス画面風のイラストが生成されます！</p>
                <textarea class="prompt-textarea" id="res-prompt" readonly onclick="this.select()"></textarea>
                <button class="btn" style="margin-top:10px; padding:8px 20px; font-size:14px;" onclick="navigator.clipboard.writeText(document.getElementById('res-prompt').value); alert('プロンプトをコピーしました！');">プロンプトをコピー</button>
            </div>
            
            <button class="btn" style="background:#666; box-shadow:none; margin-top:10px;" onclick="window.location.reload()">もう一度診断する</button>
        </div>
    </div>
</div>

// 各スコア値の算出（種族値の割り振り用ベース）
// スコアの平均値を計算し540に綺麗にマッピングするロジック
// 各指標（E,S,T,J）のバランスで決定
// HP: メンタル(Fの高さ/逆T)
// こうげき: 行動力(E)
// ぼうぎょ: 規律(J)
// とくこう: 知性(N/逆S)
// とくぼう: 正論(T)
// すばやさ: 計画スピード(JとPのバランス)
let baseHP = 25 - scores.T; // Fが高いほど高HP
let baseAtk = scores.E;
let baseDef = scores.J;
let baseSpA = 25 - scores.S; // Nが高いほど高SpA
let baseSpD = scores.T;
let baseSpe = isJ ? scores.J : (25 - scores.J);
// 最低値を保証しつつ合計540へ補正
let sum = baseHP + baseAtk + baseDef + baseSpA + baseSpD + baseSpe;
let ratio = 540 / sum;
let hp = Math.round(baseHP * ratio);
let atk = Math.round(baseAtk * ratio);
let def = Math.round(baseDef * ratio);
let spa = Math.round(baseSpA * ratio);
let spd = Math.round(baseSpD * ratio);
let spe = 540 - (hp + atk + def + spa + spd); // 合計値を完全に540にするための調整

];

});
