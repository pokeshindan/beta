<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケモナライズ診断</title>
    <style>
        @import url('https://googleapis.com');

        body {
            background-color: #1a1a1a;
            font-family: 'DotGothic16', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            user-select: none;
            color: #333;
        }

        /* 画面全体のコンテナ */
        .game-container {
            width: 100%;
            max-width: 500px;
            height: 600px;
            background: linear-gradient(to bottom, #8cadd4 0%, #e2ebf0 100%);
            border: 6px solid #4a4a4a;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* メイン画面エリア */
        .screen-area {
            flex: 1;
            position: relative;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
        }

        /* ポケモン風ステータスウインドウ */
        .status-window {
            background-color: #fffdec;
            border: 4px solid #4a4a4a;
            border-radius: 12px 0px 12px 0px;
            padding: 10px 15px;
            width: 80%;
            margin: 0 auto;
            box-shadow: 4px 4px 0px #4a4a4a;
            box-sizing: border-box;
            text-align: center;
        }

        .status-window .title {
            font-size: 20px;
            font-weight: bold;
            color: #111;
            margin-bottom: 5px;
        }

        /* 進捗バー */
        .progress-container {
            width: 100%;
            height: 10px;
            background-color: #ccc;
            border: 2px solid #4a4a4a;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 5px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #50c878;
            transition: width 0.3s ease;
        }

        /* 中央の演出・テキスト・結果表示エリア */
        .display-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
            overflow-y: auto;
        }

        /* 入力フォームスタイル */
        .input-box {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
            margin-top: 10px;
        }

        .input-box input {
            font-family: 'DotGothic16', sans-serif;
            font-size: 18px;
            padding: 5px 10px;
            border: 3px solid #4a4a4a;
            border-radius: 4px;
            width: 60%;
            text-align: center;
            outline: none;
        }

        /* 下部UIエリア（メッセージ＆コマンド） */
        .ui-area {
            height: 160px;
            background-color: #f8f8f8;
            border-top: 6px solid #4a4a4a;
            display: flex;
            flex-direction: column;
            padding: 6px;
            box-sizing: border-box;
            gap: 6px;
        }

        /* ダイヤログボックス */
        .dialog-box {
            flex: 1;
            border: 4px solid #5858a8;
            border-radius: 6px;
            background-color: #fff;
            padding: 10px 12px;
            font-size: 16px;
            line-height: 1.4;
            box-sizing: border-box;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        /* 4択コマンドボタンエリア */
        .command-box {
            height: 65px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 4px;
        }

        .btn {
            background-color: #fff;
            border: 3px solid #e08000;
            border-radius: 6px;
            font-family: 'DotGothic16', sans-serif;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            padding-left: 20px;
            outline: none;
            position: relative;
            display: flex;
            align-items: center;
            transition: background 0.1s;
        }

        .btn:hover {
            background-color: #fffdec;
        }

        .btn::before {
            content: '▶';
            position: absolute;
            left: 6px;
            color: transparent;
            font-size: 10px;
        }

        .btn:hover::before {
            color: #e08000;
        }

        /* 結果画面専用のスクロールコンテナ */
        .result-container {
            width: 100%;
            height: 100%;
            background-color: #fffdec;
            border: 4px solid #4a4a4a;
            border-radius: 8px;
            padding: 12px;
            box-sizing: border-box;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.5;
            text-align: left;
        }
        
        .result-container h3 {
            margin-top: 0;
            border-bottom: 2px dashed #4a4a4a;
            padding-bottom: 4px;
            text-align: center;
            font-size: 18px;
        }

        .code-block {
            background-color: #222;
            color: #0f0;
            padding: 8px;
            font-family: monospace;
            font-size: 11px;
            white-space: pre-wrap;
            word-break: break-all;
            border-radius: 4px;
            margin-top: 5px;
            user-select: text;
        }
    </style>
</head>
